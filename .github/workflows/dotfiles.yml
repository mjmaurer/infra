name: "Build Dotfiles"

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch:

jobs:
  build-karabiner:
    runs-on: macos-latest
    name: "Build Karabiner Config"
    steps:
      - uses: actions/checkout@v4

      - name: "Install Goku"
        run: brew install yqrashawn/goku/goku

      - name: "Compile karabiner.edn to karabiner.json"
        run: |
          mkdir -p ~/.config/karabiner
          echo '{"profiles":[{"name":"Default","selected":true,"complex_modifications":{"rules":[]}}]}' > ~/.config/karabiner/karabiner.json
          cp system/modules/kanata/karabiner.edn ~/.config/karabiner.edn
          goku

      - name: "Upload karabiner.json"
        uses: actions/upload-artifact@v7
        with:
          name: karabiner-json
          path: ~/.config/karabiner/karabiner.json
          if-no-files-found: error

  build-dotfiles:
    needs: build-karabiner
    runs-on: ubuntu-latest
    name: "Build Dotfiles"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Provision Nix"
        uses: ./.github/actions/runner

      - name: "Build home-manager files"
        run: |
          store_path=$(nix build .#homeConfigurations.linux.config.home-files --no-link --print-out-paths --option sandbox false)
          echo "STORE_PATH=$store_path" >> "$GITHUB_ENV"

      - name: "Stage portable dotfiles"
        run: |
          mkdir -p portable
          copy_if_exists() {
            src="$STORE_PATH/$1"
            if [ -e "$src" ]; then
              dest="portable/$1"
              mkdir -p "$(dirname "$dest")"
              cp -rL "$src" "$dest"
            fi
          }

          # Shell
          copy_if_exists .zshrc
          copy_if_exists .bashrc
          copy_if_exists .p10k.zsh
          copy_if_exists .inputrc
          copy_if_exists .psqlrc

          # Git
          copy_if_exists .gitconfig
          copy_if_exists .config/git

          # Claude Code
          copy_if_exists .claude

          # VSCode
          copy_if_exists .config/Code

          # Neovim
          copy_if_exists .config/nvim

          # Tmux
          copy_if_exists .config/tmux
          copy_if_exists .config/tmuxp

          # Alacritty
          copy_if_exists .config/alacritty

          # Direnv
          copy_if_exists .config/direnv

          # Obsidian
          copy_if_exists Documents/obsidian

          # AI tools
          copy_if_exists .config/aichat
          copy_if_exists .config/ai
          copy_if_exists .config/mcp
          copy_if_exists .config/llm
          copy_if_exists .config/streamdown
          copy_if_exists .aider.conf.yml
          copy_if_exists .aider.model.settings.yml
          copy_if_exists .config/aider

          # SSH
          copy_if_exists .ssh/config

          # Scripts
          copy_if_exists .local/bin

          # Aerospace (system-level config, copy from repo directly)
          cp system/modules/aerospace/aerospace.toml portable/.aerospace.toml

          echo "--- Portable dotfiles ---"
          find portable -type f | sort

      - name: "Download karabiner.json"
        uses: actions/download-artifact@v4
        with:
          name: karabiner-json
          path: portable/.config/karabiner/

      - name: "Upload portable dotfiles"
        uses: actions/upload-artifact@v7
        with:
          name: dotfiles-portable
          path: portable/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: "Publish portable dotfiles to GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd portable && zip -r ../dotfiles-portable.zip . && cd ..
          gh release create portable-dotfiles \
            --title "Portable Dotfiles" \
            --notes "Auto-updated portable dotfiles." \
            --target "${{ github.sha }}" 2>/dev/null || true
          gh release upload portable-dotfiles dotfiles-portable.zip --clobber

      - name: "Stage all dotfiles"
        run: |
          mkdir -p staging
          cp -rL "$STORE_PATH/." staging/

      - name: "Upload all dotfiles"
        uses: actions/upload-artifact@v7
        with:
          name: dotfiles-all
          path: staging/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true
